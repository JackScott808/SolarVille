# Branch: unified-main
# File: simulation.yml

# simulation.yml
simulation:
  file_path: dataset/block_0.csv
  household: MAC000002
  start_date: 2012-10-24
  timescale: d  # d=day, w=week, m=month, y=year
  simulation_speed: 300  # 300x speedup (5 min real time = 1 day simulated)
  interval_seconds: 1800  # Data interval: 1800s = 30 minutes
  log_level: INFO
  solar_scale_factor: 1000  # real hardware only: scales a tiny table-top panel up to household scale

hardware:
  mock_mode: true  # Run in mock mode without real hardware

# The simulated household (mock mode). Solar output follows real London sun: time of day,
# time of year and weather. Run scripts/fetch_pvgis.py to use real hourly data.
prosumer:
  system_kwp: 4.0           # installed PV size; a typical UK home has 3-4 kWp
  tilt_deg: 35
  azimuth_deg: 180          # 180 = facing south
  latitude: 51.5074         # London
  longitude: -0.1278
  solar_source: auto        # auto = real PVGIS data if present, otherwise the model; or: model, pvgis
  storage_capacity_kwh: 5.0 # a typical home battery
